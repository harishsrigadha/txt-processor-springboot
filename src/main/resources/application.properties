server.port=8080
spring.application.name=txn-service

# retry policy
txn.max-attempts=3
txn.backoff-millis=0

# demo only: T2 times out twice then recovers, T7 never recovers. Set to false for real use.
txn.demo-failures=true

# unknown enum text (e.g. transactionType=XYZ) becomes null -> that one request is REJECTED, batch continues
spring.jackson.deserialization.read-unknown-enum-values-as-null=true
